<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/">
    <title>Document</title>
</head>
<body>

<header>
    <h1>Økonomi</h1>
    <p>Økonomisk oversikt</p>
</header>
<main>
    <section>
        <h2>Interkter </h2>
        <input type="text" id="inntekt" placeholder="skriv inn inntekten her">
        <input type="text" id="IntekterBelop" placeholder="skriv inn beløpet i kr">
        <button id="leggTilInntekt">Legg til inntekten</button>
    </section>

    <section>
        <h2>Utgifter</h2>
        <input type="text" id="utgift" placeholder="skriv inn utgiften her">
        <input type="text" id="UtgifterBelop" placeholder="skriv inn beløpet i kr">
        <button id="leggTilUtgift">Legg til utgiften</button>
    </section>

    <section>
        <h2>Inntekter tabell</h2>
        <ul id="inntekter"></ul>
    </section>

    <section>
        <h2>Utgifter tabell</h2>
        <ul id="utgifter">
        </ul>
    </section>

    <section>
        <h2>måndelig saldo</h2>
        <p id="saldo">0.00 kr</p>
    </section>

</main>
<script src="/javascript/script.js"></script>
</body>
</html>
